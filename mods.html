      }
      function login() {

          error.textContent = "Ingresa el correo electrónico que brindaste para la validación de tu pago.";

        if (estado === "no_existe") {

        }
        function manejarEstadoPlayerExtra(event) {
          const transition = extraTransition;
          if (transition && event.target === transition.incoming) {
            if (event.data === YT.PlayerState.CUED) {
              transition.cued = true;
              if (transition.force) iniciarFadePlaylistExtra(transition);
            } else if (event.data === YT.PlayerState.PLAYING) {
              iniciarFadePlaylistExtra(transition);
            }
          }
          if (event.target === playerExtra && event.data === YT.PlayerState.ENDED) {
            if (!extraTransition) iniciarTransicionPlaylistExtra(true);
            else {
              extraTransition.force = true;
              if (extraTransition.cued) iniciarFadePlaylistExtra(extraTransition);
            }
          }
        }
        function manejarErrorPlaylistExtra(event) {
          if (extraTransition && event.target === extraTransition.incoming) {
            cancelarCicloExtra();
            if (playerExtra && typeof playerExtra.setVolume === "function") playerExtra.setVolume(10);
          }
        }
        function supervisarPlaylistExtra() {
          if (!playerExtra || !playerExtraReady || !currentExtraPlaylist) return;
          try {
            if (extraTransition) {
              if (!extraTransition.started && extraTransition.cued) {
                const duracionActual = playerExtra.getDuration();
                const restanteActual = duracionActual - playerExtra.getCurrentTime();
                if (extraTransition.force || restanteActual <= 5000) iniciarFadePlaylistExtra(extraTransition);
              }
              return;
            }
            if (playerExtra.getPlayerState() !== YT.PlayerState.PLAYING) return;
            const lista = playerExtra.getPlaylist();
            const indice = playerExtra.getPlaylistIndex();
            const duracion = playerExtra.getDuration();
            const restante = duracion - playerExtra.getCurrentTime();
            if (lista && lista.length && indice === lista.length - 1 && restante <= 8000) {
              iniciarTransicionPlaylistExtra(false);
              if (extraTransition && extraTransition.cued && restante <= 5000) iniciarFadePlaylistExtra(extraTransition);
            }
          } catch (_) {}
        }
        function loadYouTubeExtra(id) {
          if (!window.YT || !playerExtra || !playerExtraReady || typeof playerExtra.loadPlaylist !== "function") {
            pendingExtraPlaylist = id;
            solicitarAPIYouTube();
            return;
          }
          cancelarCicloExtra();
          currentExtraPlaylist = id;
          playerExtra.stopVideo();
          playerExtra.unMute();
          playerExtra.setVolume(10);
          playerExtra.loadPlaylist({ listType: 'playlist', list: id, index: 0, suggestedQuality: 'large' });
          if (typeof playerExtra.setLoop === "function") playerExtra.setLoop(false);
        }
        window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;
        document.getElementById("boton1").addEventListener("click", () => {
          document.getElementById("confirmacionBoton1Overlay").style.display = "flex";
        });
        document.getElementById("confirmacionBoton1Si").addEventListener("click", () => {
          solicitarAPIYouTube();
          document.getElementById("confirmacionBoton1Overlay").style.display = "none";
          document.getElementById("parte1").classList.add("hidden");
          document.getElementById("parte2").classList.remove("hidden");
          asegurarPantallaCompleta();
        });
        document.getElementById("confirmacionBoton1No").addEventListener("click", resetear);
        let isPaused = false;
            sincronizarDiscos();
        const botonPause = document.getElementById("botonPause");
        const iconPause = botonPause.querySelector("i");
        function obtenerReproductoresPausa() {
          return [...new Set([player, fadeTransition && fadeTransition.incoming].filter(Boolean))];
        }
        function cancelarDesvanecidoVolumen() {
          if (volumeFadeTimer) {
            clearInterval(volumeFadeTimer);
            volumeFadeTimer = null;
          }
        }
        function desvanecerVolumen(reproductores, volumenInicial, volumenFinal, alTerminar) {
          cancelarDesvanecidoVolumen();
          const inicio = Date.now();
          volumeFadeTimer = setInterval(() => {
            const progreso = Math.min((Date.now() - inicio) / 3000, 1);
            const volumen = Math.round(volumenInicial + (volumenFinal - volumenInicial) * progreso);
            reproductores.forEach(deck => deck.setVolume(volumen));
            if (progreso >= 1) {
              cancelarDesvanecidoVolumen();
              alTerminar();
            }
          }, 50);
        }
        botonPause.onclick = () => {
          if (!player || botonPause.disabled) return;
          cancelarDesvanecidoVolumen();
          const reproductores = obtenerReproductoresPausa();
          botonPause.disabled = true;
          botonPause.classList.add("is-playing");
          if (!isPaused) {
            reproductores.forEach(deck => deck.setVolume(100));
            isPaused = true;
            iconPause.className = "fa-solid fa-play";
            sincronizarDiscos();
            desvanecerVolumen(reproductores, 100, 0, () => {
              reproductores.forEach(deck => {
                deck.pauseVideo();
                deck.setVolume(0);
              });
              botonPause.classList.remove("is-playing");
              botonPause.disabled = false;
              sincronizarDiscos();
            });
          } else {
            reproductores.forEach(deck => {
              deck.setVolume(0);
              deck.playVideo();
            });
            isPaused = false;
            iconPause.className = "fa-solid fa-pause";
            sincronizarDiscos();
            desvanecerVolumen(reproductores, 0, 100, () => {
              reproductores.forEach(deck => deck.setVolume(100));
              botonPause.classList.remove("is-playing");
              botonPause.disabled = false;
            });
          }
        };
        const playlist12Videos = [ "hBz-avUwksY", "4AfXqf2CE8A", "8TB4XgI23uo", "nIeGu4zZpiQ", "ZjM-CBv_4rc", "TWmOLEDW8Q8", "aELPikOUJFg", "D4c7ZG7r7QQ", "G7-dT9cTlDQ", "r9_oBKxn50Y" ];
        function reproducirPlaylistRandom() {
          if (!playlist12Videos.length || !playerRandom || !player) return;
          const botonYT = document.getElementById("botonYT");
          botonYT.disabled = true;
          botonYT.classList.add("is-playing");
          if (randomVolumeTimer) { clearInterval(randomVolumeTimer); randomVolumeTimer = null; }
          if (randomBackgroundPlayer && randomBackgroundPlayer !== player) randomBackgroundPlayer.setVolume(100);
          randomBackgroundPlayer = player;
          randomBackgroundPlayer.setVolume(80);
          const randomIndex = Math.floor(Math.random() * playlist12Videos.length);
          playerRandom.loadVideoById(playlist12Videos[randomIndex]);
        }
        function finalizarReproduccionYT() {
          restaurarVolumenFondo();
          const botonYT = document.getElementById("botonYT");
          botonYT.classList.remove("is-playing");
          botonYT.disabled = false;
        }
        function restaurarVolumenFondo() {
          if (!randomBackgroundPlayer) return;
          if (randomVolumeTimer) clearInterval(randomVolumeTimer);
          const playersFondo = [...new Set([randomBackgroundPlayer, player].filter(Boolean))];
          randomBackgroundPlayer = null;
          const inicio = Date.now();
          randomVolumeTimer = setInterval(() => {
            const progreso = Math.min((Date.now() - inicio) / 2000, 1);
            const volumen = Math.round(80 + 20 * progreso);
            playersFondo.forEach(playerFondo => playerFondo.setVolume(volumen));
            if (progreso >= 1) {
              playersFondo.forEach(playerFondo => playerFondo.setVolume(100));
              clearInterval(randomVolumeTimer);
              randomVolumeTimer = null;
            }
          }, 100);
        }
        const prefijosBotonR = { 1: "red", 2: "black", 3: "gray", 4: "white", 5: "pink", 6: "blue", 7: "orange", 8: "green", 9: "yellow" };
        let ultimoBotonR = null;
        function mostrarDivRandomActivo() {
          const paginaActiva = Array.from(document.querySelectorAll(".pagina-principal")).find(div => {
            return div.dataset.index && window.getComputedStyle(div).display !== "none";
          });
          if (!paginaActiva) return;
          const prefijo = prefijosBotonR[paginaActiva.dataset.index];
          if (!prefijo) return;
          const candidatos = Array.from(paginaActiva.querySelectorAll(`img[alt^="${prefijo}-"]`)).filter(img => {
            return /-[1-9][0-9]*$/.test(img.getAttribute("alt") || "");
          });
          if (!candidatos.length) return;
          const disponibles = candidatos.length > 1 ? candidatos.filter(img => img !== ultimoBotonR) : candidatos;
          const elegido = disponibles[Math.floor(Math.random() * disponibles.length)];
          const texto = elegido.closest(".texto-secundario");
          const pantalla = elegido.closest(".pagina-secundaria");
          if (!texto || !pantalla) return;
          paginaActiva.querySelectorAll(".texto-secundario").forEach(div => {
            div.style.display = "none";
          });
          const bg = pantalla.getAttribute("data-bg") || pantalla.dataset.originalBg;
          if (bg) precargarFondoSlide(pantalla, bg);
          pantalla.style.visibility = "visible";
          texto.style.display = "block";
          pantalla.scrollIntoView({ behavior: "smooth", block: "start" });
          ultimoBotonR = elegido;
        }
        document.getElementById("botonR").addEventListener("click", mostrarDivRandomActivo);
        document.getElementById("botonYT").addEventListener("click", reproducirPlaylistRandom);
      })();
    </script>
  </body>
